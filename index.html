<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#243b31"><title>ふたりのキャンプ｜持ち物チェック</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f0;color:#24342b;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif}.app{max-width:680px;margin:auto;padding:14px 12px 90px}header{position:sticky;top:0;background:#f4f5f0f2;backdrop-filter:blur(12px);z-index:3;padding:8px 0 12px}h1{font-size:21px;margin:0 0 8px}.sub{font-size:12px;color:#738176}.progress{height:8px;background:#dce4d9;border-radius:8px;overflow:hidden;margin-top:9px}.bar{height:100%;background:#52836b;width:0;transition:.2s}.topline{display:flex;justify-content:space-between;align-items:center}.actions{display:flex;gap:7px;margin-top:9px}.actions button{border:1px solid #d4ded5;border-radius:9px;background:white;color:#344b3d;padding:7px 12px;font-size:12px}.section{background:#fff;border:1px solid #e1e7df;border-radius:13px;margin:9px 0;overflow:hidden}.section summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;font-weight:700;font-size:15px}.section summary::-webkit-details-marker{display:none}.section summary .right{font-size:12px;color:#738176;font-weight:500}.items{padding:0 9px 10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}.item{border:1px solid #e2e7e1;border-radius:9px;min-height:45px;padding:8px;display:flex;align-items:center;gap:7px;font-size:12.5px;line-height:1.35;cursor:pointer;user-select:none}.item input{width:18px;height:18px;accent-color:#48765b;flex-shrink:0;margin:0}.item:has(input:checked){background:#edf5ed;color:#708575}.item:has(input:checked) span{text-decoration:line-through}.note{font-size:11px;color:#77857a;padding:0 14px 11px}.footer{font-size:11px;color:#7b897d;text-align:center;padding:12px}@media(max-width:350px){.items{grid-template-columns:1fr}.item{font-size:14px}}@media(min-width:600px){.items{grid-template-columns:repeat(3,1fr)}}@media print{header{position:static}.app{padding-bottom:0}.section{break-inside:avoid}.actions{display:none}}</style></head><body><div class="app"><header><div class="topline"><div><h1>🏕️ ふたりのキャンプ</h1><div class="sub">持ち物チェックリスト｜タップで完了</div></div><strong id="counter">0 / 0</strong></div><div class="progress"><div class="bar" id="bar"></div></div><div class="actions"><button id="expand">すべて開く</button><button id="collapse">すべて閉じる</button><button id="reset">チェックをリセット</button></div></header><main id="main"></main><div class="footer">チェック状態はこのブラウザ内に保存されます。<br>別の端末やブラウザには自動同期されません。</div></div><script>
const groups=[
['⛺ テント・寝具',['テント','インナーテント','インナーマット','ペグ・ペグハンマー','グランドシート','エアマット','空気入れ','枕','寝袋','タープ・ポール']],
['🪑 家具・キッチン台',['ヘリノックス椅子','IGTテーブル（台所）','延長テーブル','短い脚6本（追加脚）','フラットバーナー','ステンレスカゴ','小さいカゴ','ステンレス天板','追加テーブル・脚4本（必要時）']],
['💡 電源・照明・その他',['電源延長コード','チャムスクーラーボックス','ロゴス冷凍パック','クーラーボックス台','ランタン・マントル・ポール','ミニランタン（複数）','石井家にもらったランタン','ランタンを吊るすロープ','スピーカー']],
['🔥 焚き火',['焚き火台・焼き台（選択）','焚き火台マット']],
['🍳 調理道具（料理に応じて）',['やかん','トングなどの調理ツール','調味料一式','油（液漏れ注意）','バット','マルチグリドル']],
['🍷 食器・カトラリー',['皿','シェラカップ','サーモスカップ','割りばし（焚き火で処分可）','石井家にもらったワイングラス']],
['🧽 片付け・衛生',['洗い物用カゴ','ペーパータオル・布巾','吸水ワイパー','ファブリーズ','ゴミ袋','雑巾','ウェットティッシュ','食器洗剤・ブラシ','ゴム手袋','キッチンペーパー']]
];
const key='camp-couple-checklist-v1';let checked={};try{checked=JSON.parse(localStorage.getItem(key)||'{}')}catch{};const main=document.getElementById('main');let all=[];
groups.forEach(([name,items],gi)=>{const details=document.createElement('details');details.className='section';details.open=gi===0;const summary=document.createElement('summary');summary.innerHTML='<span>'+name+'</span><span class="right" id="group-'+gi+'"></span>';details.append(summary);const grid=document.createElement('div');grid.className='items';items.forEach((item,ii)=>{const id=gi+'-'+ii;all.push(id);const label=document.createElement('label');label.className='item';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!checked[id];cb.addEventListener('change',()=>{checked[id]=cb.checked;localStorage.setItem(key,JSON.stringify(checked));update()});const span=document.createElement('span');span.textContent=item;label.append(cb,span);grid.append(label)});details.append(grid);main.append(details)});
function update(){const n=all.filter(x=>checked[x]).length;document.getElementById('counter').textContent=n+' / '+all.length;document.getElementById('bar').style.width=(100*n/all.length)+'%';groups.forEach((g,i)=>{const count=g[1].filter((_,j)=>checked[i+'-'+j]).length;document.getElementById('group-'+i).textContent=count+' / '+g[1].length+'  '+(count===g[1].length?'✓':'⌄')})}update();document.getElementById('expand').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=true);document.getElementById('collapse').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=false);document.getElementById('reset').onclick=()=>{if(confirm('すべてのチェックを解除しますか？')){checked={};localStorage.setItem(key,'{}');document.querySelectorAll('input').forEach(x=>x.checked=false);update()}};
</script></body></html>
